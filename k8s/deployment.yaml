apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-rag-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: enterprise-rag-api
  template:
    metadata:
      labels:
        app: enterprise-rag-api
    spec:
      containers:
        - name: api
          image: enterprise-rag-api:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: postgresql+asyncpg://postgres:postgres@postgres:5432/rag
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: QDRANT_URL
              value: http://qdrant:6333
---
apiVersion: v1
kind: Service
metadata:
  name: enterprise-rag-api
spec:
  selector:
    app: enterprise-rag-api
  ports:
    - port: 80
      targetPort: 8000
