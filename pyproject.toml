[tool.poetry]
name = "enterprise-rag-platform"
version = "0.1.0"
description = "Production-grade enterprise RAG platform"
authors = ["OpenAI <dev@example.com>"]
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = ">=3.13,<3.14"
fastapi = {extras = ["all"], version = "^0.115.0"}
uvicorn = {extras = ["standard"], version = "^0.31.0"}
pydantic = "^2.9.0"
pydantic-settings = "^2.4.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.0"}
alembic = "^1.16.0"
asyncpg = "^0.25.0"
redis = "^5.0.0"
qdrant-client = "^1.7.0"
langgraph = "^0.3.0"
openai = "^1.52.0"
anthropic = "^0.37.0"
httpx = "^0.28.0"
python-jose = {extras = ["cryptography"], version = "^3.6.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.0"}
python-multipart = "^0.0.20"
python-docx = "^1.1.0"
pypdf = "^5.0.0"
pptx = "^0.0.1"
pillow = "^10.0.0"
pytesseract = "^0.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.0"
pytest-asyncio = "^0.24.0"
ruff = "^0.71.0"
mypy = "^1.13.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
