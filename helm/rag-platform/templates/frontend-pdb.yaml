{{- if and .Values.frontend.enabled .Values.frontend.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "rag-platform.fullname" . }}-frontend
  labels:
    {{- include "rag-platform.frontendLabels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.frontend.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "rag-platform.frontendSelectorLabels" . | nindent 6 }}
{{- end }}
