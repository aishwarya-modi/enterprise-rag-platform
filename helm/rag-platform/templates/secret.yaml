apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rag-platform.fullname" . }}-secrets
  labels:
    {{- include "rag-platform.labels" . | nindent 4 }}
type: Opaque
data:
  jwt-secret-key: {{ .Values.secrets.jwtSecretKey | b64enc | quote }}
  database-url: {{ (printf "postgresql+asyncpg://postgres:postgres@%s-postgresql:5432/rag" .Release.Name) | b64enc | quote }}
  {{- if .Values.secrets.openaiApiKey }}
  openai-api-key: {{ .Values.secrets.openaiApiKey | b64enc | quote }}
  {{- else }}
  openai-api-key: "" | quote
  {{- end }}
  {{- if .Values.secrets.anthropicApiKey }}
  anthropic-api-key: {{ .Values.secrets.anthropicApiKey | b64enc | quote }}
  {{- else }}
  anthropic-api-key: "" | quote
  {{- end }}
