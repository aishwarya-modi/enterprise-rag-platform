name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  docker-build-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: meta
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: docker-build-push
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > $HOME/.kube/config

      - name: Deploy with Helm
        run: |
          helm dependency update helm/rag-platform
          helm upgrade --install rag-platform helm/rag-platform \
            --namespace rag-staging \
            --create-namespace \
            --set backend.image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend \
            --set backend.image.tag=${{ needs.docker-build-push.outputs.version }} \
            --set frontend.image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend \
            --set frontend.image.tag=${{ needs.docker-build-push.outputs.version }} \
            --set configMap.environment=staging \
            --wait \
            --timeout 5m

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/rag-platform-backend -n rag-staging --timeout=300s
          kubectl rollout status deployment/rag-platform-frontend -n rag-staging --timeout=300s

      - name: Run smoke tests
        run: |
          kubectl run smoke-test --rm -i --restart=Never \
            --image=curlimages/curl:latest \
            --namespace=rag-staging \
            --overrides='{"spec":{"containers":[{"name":"smoke-test","image":"curlimages/curl:latest","command":["curl","-sf","http://rag-platform-backend/health"]}],"restartPolicy":"Never"}}' || true

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker-build-push, deploy-staging]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > $HOME/.kube/config

      - name: Deploy with Helm
        run: |
          helm dependency update helm/rag-platform
          helm upgrade --install rag-platform helm/rag-platform \
            --namespace rag-production \
            --create-namespace \
            --set backend.image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend \
            --set backend.image.tag=${{ needs.docker-build-push.outputs.version }} \
            --set frontend.image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend \
            --set frontend.image.tag=${{ needs.docker-build-push.outputs.version }} \
            --set configMap.environment=production \
            --set backend.autoscaling.minReplicas=3 \
            --set backend.autoscaling.maxReplicas=15 \
            --set frontend.autoscaling.minReplicas=3 \
            --wait \
            --timeout 10m

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/rag-platform-backend -n rag-production --timeout=600s
          kubectl rollout status deployment/rag-platform-frontend -n rag-production --timeout=600s

  release-notes:
    name: Release Notes
    runs-on: ubuntu-latest
    needs: [docker-build-push, deploy-production]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGES=$(git log --pretty=format:"- %s (%h)" --no-merges -20)
          fi

          cat <<EOF > release-notes.md
          ## Changes

          ${CHANGES}

          ## Docker Images

          - \`${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:${{ needs.docker-build-push.outputs.version }}\`
          - \`${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:${{ needs.docker-build-push.outputs.version }}\`

          ## Deployment

          - Staging: deployed
          - Production: deployed

          ## Helm

          \`\`\`
          helm upgrade --install rag-platform helm/rag-platform \\
            --set backend.image.tag=${{ needs.docker-build-push.outputs.version }} \\
            --set frontend.image.tag=${{ needs.docker-build-push.outputs.version }}
          \`\`\`
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
