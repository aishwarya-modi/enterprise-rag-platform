name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'fastapi[all]>=0.115.0' 'uvicorn[standard]>=0.31.0' 'pydantic>=2.9.0' 'pydantic-settings>=2.4.0' 'sqlalchemy[asyncio]>=2.0.0' 'asyncpg>=0.25.0' 'httpx>=0.28.0' 'python-multipart>=0.0.20' 'pytest>=8.4.0' 'pytest-asyncio>=0.24.0'
      - name: Run tests
        run: |
          PYTHONPATH=backend pytest -q backend/app/modules/auth/tests/test_auth_api.py backend/app/modules/documents/tests/test_documents_api.py backend/app/modules/llm/tests/test_llm_api.py backend/app/modules/tenants/tests/test_tenants_api.py
